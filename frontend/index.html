<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma TUA</title>
    <link rel="stylesheet" href="index.CSS">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>
    <!-- Botón fijo para retroceder un paso en el flujo (ver retroceder() en index.js) -->
    <button id="btn-volver" onclick="retroceder()">← Volver</button>

    <!-- Pantalla de login: se muestra primero y oculta todo lo demás hasta
         que el usuario entra con una cuenta creada en Supabase -->
    <div id="login">
        <h1>Iniciar sesión</h1>

        <form id="login-form" onsubmit="iniciarSesion(); return false;">
            <label for="login-name">Nombre de usuario</label>
            <input type="text" id="login-name" autocomplete="username">

            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>
        <p id="login-error"></p>
    </div>

    <!-- Pantalla de bienvenida: primer paso tras iniciar sesión -->
    <div id="bienvenida">
        <h1>¡Hola!<br>¿Creamos la escaleta del programa?</h1>
        <button onclick="comenzar()" id="pregunta-inicial">¡Comencemos!</button>
        <button onclick="mostrarBuscador()">Buscar temas ya tratados</button>
    </div>

    <!-- Buscador de temas ya tratados: consulta los episodios publicados en
         Spotify (vía una Netlify Function) y filtra por nombre/descripción -->
    <div id="buscador">
        <h2>Buscar temas ya tratados</h2>
        <input type="text" id="buscador-input" placeholder="Escribe una palabra clave..." autocomplete="off">
        <div id="buscador-resultados"></div>
        <button onclick="volverDesdeBuscador()">Volver</button>
    </div>

    <!-- Pregunta 1: ¿hay entrevista? Si se responde "Sí" aparecen los campos
         de texto, duración y observaciones -->
    <div class="pregunta-inicial" id="pregunta-1">
        <label for="interview">¿Hay entrevista?</label>
        <select id="interview" autocomplete="off">
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
        </select>

        <div id="entrevista-extra" class="extra-campos">
            <label for="entrevista-texto">Entrevista</label>
            <input type="text" id="entrevista-texto" autocomplete="off">

            <label for="entrevista-duracion">Duración</label>
            <select id="entrevista-duracion" autocomplete="off"></select>

            <label for="entrevista-observaciones">Observaciones</label>
            <textarea id="entrevista-observaciones"></textarea>
        </div>

        <button id="continuar-1" class="btn-continuar" onclick="continuarPregunta1()">Continuar</button>
    </div>

    <!-- Pregunta 2: ¿hay minisección? Si se responde "Sí" se elige cuántas
         hay y luego el nombre y la duración de cada una -->
    <div class="pregunta-inicial" id="pregunta-2">
        <label for="mini">¿Hay minisección?</label>
        <select id="mini" autocomplete="off">
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="true">Sí</option>
            <option value="false">No</option>
        </select>

        <div id="mini-extra" class="extra-campos">
            <label for="mini-cantidad">Número de minisecciones</label>
            <select id="mini-cantidad" autocomplete="off">
                <option value="" selected disabled>Selecciona nº</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <!-- Aquí se generan por JS los selects de nombre/duración de cada minisección -->
            <div id="mini-nombres-container"></div>
        </div>

        <button id="continuar-2" class="btn-continuar" onclick="continuarPregunta2()">Continuar</button>
    </div>

    <!-- Pregunta 3: número de secciones del programa -->
    <div class="pregunta-inicial" id="pregunta-3">
        <label for="cantidad">Número de secciones</label>
        <select id="cantidad" autocomplete="off">
            <option value="" selected disabled>Selecciona nº secciones</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>

        <button id="continuar-3" class="btn-continuar" onclick="continuarPregunta3()">Continuar</button>
    </div>

    <!-- Formulario editable de cada sección, generado por JS (generarSecciones()) -->
    <div id="desplegable-container"></div>
    <button id="btn-vista-previa" onclick="mostrarPrevisualizacion()">Vista previa</button>

    <!-- Previsualización final: una tarjeta por bloque (entrevista, minisecciones
         y secciones), reordenables antes de generar el PDF -->
    <div id="previsualizacion">
        <div id="previsualizacion-intro">
            <h2>Previsualización de la escaleta</h2>
            <p>Arrastra las tarjetas para reordenarlas</p>
        </div>
        <div id="lista-bloques"></div>
        <div class="botones-previsualizacion">
            <button onclick="volverAEditar()">Volver a editar</button>
            <button onclick="generarPDF()">Generar PDF</button>
        </div>
    </div>

    <!-- Librerías externas: generación de PDF (jsPDF + AutoTable), arrastrar
         y soltar (SortableJS) y cliente de Supabase (base de datos + login) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- config.js define SUPABASE_URL y SUPABASE_ANON_KEY, usadas en index.js -->
    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
